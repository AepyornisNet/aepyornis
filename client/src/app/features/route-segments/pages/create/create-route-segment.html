<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-4 mb-0">
        <app-icon name="route-segment" size="48" />
        {{ 'Create route segment' | translate }}
      </h1>
      <p class="text-muted">{{ 'Upload a GPX file to create a route segment' | translate }}</p>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger" role="alert">
      {{ error() }}
    </div>
  }

  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <form [formRoot]="routeSegmentForm" (ngSubmit)="createRouteSegment()">
            <app-file-upload-list
              accept=".gpx"
              [disabled]="creating()"
              [helpText]="'Select one or more GPX files' | translate"
              [label]="'GPX file' | translate"
              [nameLabel]="'Route segment name' | translate"
              [namePlaceholder]="'Route segment name' | translate"
              [optionalName]="false"
              [(items)]="uploadFiles"
            />

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="category">{{ 'Category' | translate }}</label>
                <select class="form-select" id="category" [formField]="routeSegmentForm.category">
                  <option value="">{{ 'Not specified' | translate }}</option>
                  @for (t of availableTypes(); track t) {
                    <option [value]="t">{{ sportLabel(t) | translate }}</option>
                  }
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="difficulty">{{ 'Difficulty' | translate }}</label>
                <select
                  class="form-select"
                  id="difficulty"
                  [formField]="routeSegmentForm.difficulty"
                >
                  <option value="">{{ 'Not specified' | translate }}</option>
                  <option value="easy">{{ 'Easy' | translate }}</option>
                  <option value="moderate">{{ 'Moderate' | translate }}</option>
                  <option value="difficult">{{ 'Difficult' | translate }}</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="visibility">{{ 'Visibility' | translate }}</label>
              <select class="form-select" id="visibility" [formField]="routeSegmentForm.visibility">
                <option value="public">{{ 'Public' | translate }}</option>
                <option value="followers">{{ 'Followers' | translate }}</option>
                <option value="private">{{ 'Private' | translate }}</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="description">{{ 'Description' | translate }}</label>
              <textarea
                class="form-control"
                id="description"
                rows="3"
                [formField]="routeSegmentForm.description"
                [placeholder]="'Detailed description of the route segment' | translate"
              ></textarea>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  id="bidirectional"
                  type="checkbox"
                  [formField]="routeSegmentForm.bidirectional"
                />
                <label class="form-check-label" for="bidirectional">
                  <app-icon name="bidirectional" size="16" />
                  {{ 'Bidirectional' | translate }}
                </label>
                <div class="form-text">
                  {{ 'Check if the route can be traversed in both directions' | translate }}
                </div>
              </div>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  id="circular"
                  type="checkbox"
                  [formField]="routeSegmentForm.circular"
                />
                <label class="form-check-label" for="circular">
                  <app-icon name="circular" size="16" />
                  {{ 'Circular' | translate }}
                </label>
                <div class="form-text">
                  {{ 'Check if the route is a loop circuit' | translate }}
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="notes">{{ 'Notes' | translate }}</label>
              <textarea
                class="form-control"
                id="notes"
                rows="4"
                [formField]="routeSegmentForm.notes"
              ></textarea>
            </div>

            <div class="d-grid gap-2">
              <button
                class="btn btn-primary btn-lg"
                type="submit"
                [disabled]="creating() || !hasFiles() || routeSegmentForm().invalid()"
              >
                @if (creating()) {
                  <span
                    aria-hidden="true"
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                  ></span>
                  <span>{{ 'Creating' | translate }}</span>
                } @else {
                  <span>{{ 'Create route segment' | translate }}</span>
                }
              </button>
              <button class="btn btn-outline-secondary" type="button" (click)="goBack()">
                <span>{{ 'Cancel' | translate }}</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
