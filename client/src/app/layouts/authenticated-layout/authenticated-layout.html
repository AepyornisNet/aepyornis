<div
  class="d-flex flex-row min-vh-100"
  [attr.tabindex]="mobileSidebarVisible() ? '0' : null"
  (click)="mobileSidebarVisible() && toggleMobileSidebar($event)"
  (keydown.enter)="mobileSidebarVisible() && toggleMobileSidebar($event)"
>
  <app-sidebar
    [isOpen]="sidebarOpen()"
    [mobileSidebarVisible]="mobileSidebarVisible()"
    (sidebarToggle)="toggleSidebar()"
  />

  <div class="app-content">
    <app-header
      class="sticky-top"
      [isAdmin]="isAdmin()"
      [showSidebar]="sidebarOpen()"
      [userName]="userName()"
      (logout)="handleLogout()"
      (toggleSidebar)="toggleSidebar()"
    />

    <main class="flex-grow-1 main-content">
      <router-outlet />
    </main>

    @if (!isFeedRoute()) {
      <app-footer />
    }
  </div>
</div>
