<footer class="py-4 mt-auto">
  <div class="container">
    <div class="row">
      <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
        <p class="mb-0 text-muted">
          <small>Aepyornis</small>
          @if (version() && versionSha()) {
            <a
              class="text-decoration-none me-3"
              target="_blank"
              [href]="'https://github.com/AepyornisNet/aepyornis/tree/' + versionSha()"
            >
              <small> - {{ version() }}</small>
            </a>
          }
        </p>
      </div>
      <div class="col-md-6 text-center text-md-end">
        <p class="mb-0 text-muted">
          <small>
            <a
              class="text-decoration-none me-3"
              href="https://hosted.weblate.org/engage/aepyornis/"
              target="_blank"
              >{{ 'Help Translate' | translate }}</a
            >
            @if (versionSha()) {
              <a
                class="text-decoration-none me-3"
                target="_blank"
                [href]="
                  'https://github.com/AepyornisNet/aepyornis/tree/' + versionSha() + '/CHANGELOG.md'
                "
                >{{ 'Changelog' | translate }}</a
              >
            }
            @if (hasLegalNotice()) {
              <a class="text-decoration-none me-3" routerLink="/legal/notice">{{
                'Legal Notice' | translate
              }}</a>
            }
            @if (hasPrivacy()) {
              <a class="text-decoration-none me-3" routerLink="/legal/privacy">{{
                'Privacy Policy' | translate
              }}</a>
            }
            <a
              class="text-decoration-none"
              href="https://github.com/AepyornisNet/aepyornis"
              target="_blank"
            >
              GitHub
            </a>
          </small>
        </p>
      </div>
    </div>
  </div>
</footer>
