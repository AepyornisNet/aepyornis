name: Test the code

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"

      - name: Run Go tests
        run: go test -v ./...
